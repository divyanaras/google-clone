<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <style>
        :root {
            --bg-primary: #f5f0e6;
            --bg-secondary: #ebe4d6;
            --bg-footer: #e8dfcf;
            --text-primary: #202124;
            --text-secondary: #5f6368;
            --text-link: #1a73e8;
            --border-color: #d0c9b8;
            --shadow-light: rgba(60, 64, 67, 0.3);
            --shadow-medium: rgba(60, 64, 67, 0.15);
            --google-blue: #1a73e8;
            --google-red: #ea4335;
            --google-yellow: #fbbc05;
            --google-green: #34a853;
            --dot-color: #c4b9a5;
            --btn-active: #e8dfcf;
        }

        [data-theme="dark"] {
            --bg-primary: #202124;
            --bg-secondary: #303134;
            --bg-footer: #171717;
            --text-primary: #e8eaed;
            --text-secondary: #9aa0a6;
            --text-link: #8ab4f8;
            --border-color: #5f6368;
            --shadow-light: rgba(0, 0, 0, 0.3);
            --shadow-medium: rgba(0, 0, 0, 0.15);
            --dot-color: #444444;
            --btn-active: #3c4043;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            position: relative;
            overflow-x: hidden;
        }

        /* Polka dots background */
        .polka-dots {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            background-image: radial-gradient(circle, var(--dot-color) 1px, transparent 1px);
            background-size: 20px 20px;
            opacity: 0.5;
        }

        [data-theme="dark"] .polka-dots {
            opacity: 0.3;
        }

        /* Header Navigation */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        .header-left {
            display: flex;
            gap: 20px;
        }

        .header-left a {
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 13px;
            transition: color 0.2s ease;
        }

        .header-left a:hover {
            color: var(--text-link);
        }

        .header-left a:active {
            background-color: var(--btn-active);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-right a {
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 13px;
            padding: 8px 12px;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .header-right a:hover {
            color: var(--text-primary);
            background-color: var(--bg-secondary);
        }

        .labs-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 4px;
            transition: background-color 0.2s ease;
        }

        .labs-container:hover {
            background-color: var(--bg-secondary);
        }

        .labs-icon {
            width: 20px;
            height: 24px;
            position: relative;
        }

        .flask-body {
            width: 16px;
            height: 14px;
            border: 2px solid var(--text-secondary);
            border-top: none;
            border-radius: 0 0 4px 4px;
            position: absolute;
            bottom: 0;
            left: 2px;
            background: transparent;
        }

        .flask-neck {
            width: 6px;
            height: 8px;
            border: 2px solid var(--text-secondary);
            border-bottom: none;
            position: absolute;
            top: 0;
            left: 7px;
        }

        .flask-liquid {
            width: 10px;
            height: 6px;
            background: linear-gradient(180deg, var(--google-green) 0%, var(--google-blue) 100%);
            border-radius: 0 0 2px 2px;
            position: absolute;
            bottom: 2px;
            left: 3px;
            opacity: 0.8;
        }

        .labs-text {
            font-size: 10px;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .apps-button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease;
        }

        .apps-button:hover {
            background-color: var(--bg-secondary);
        }

        .apps-grid {
            display: grid;
            grid-template-columns: repeat(3, 4px);
            gap: 3px;
        }

        .apps-grid span {
            width: 4px;
            height: 4px;
            background-color: var(--text-secondary);
            border-radius: 50%;
        }

        .profile-circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .profile-circle:hover {
            transform: scale(1.1);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin-top: 50px;
        }

        /* Google Logo - Retro 90s Vibrant */
        .google-logo {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            cursor: default;
        }

        .google-letter {
            font-size: 110px;
            font-weight: 900;
            font-family: 'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            transition: transform 0.3s ease, filter 0.3s ease;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: -4px;
        }

        .google-letter:hover {
            transform: scale(1.15);
            filter: brightness(1.3);
        }

        .google-letter:nth-child(1) { 
            color: #3366cc; 
            text-shadow: 3px 3px 0 #003399, 6px 6px 10px rgba(51, 102, 204, 0.4);
        }
        .google-letter:nth-child(2) { 
            color: #ff3333; 
            text-shadow: 3px 3px 0 #cc0000, 6px 6px 10px rgba(255, 51, 51, 0.4);
        }
        .google-letter:nth-child(3) { 
            color: #ffcc00; 
            text-shadow: 3px 3px 0 #ff9900, 6px 6px 10px rgba(255, 204, 0, 0.4);
        }
        .google-letter:nth-child(4) { 
            color: #3366cc; 
            text-shadow: 3px 3px 0 #003399, 6px 6px 10px rgba(51, 102, 204, 0.4);
        }
        .google-letter:nth-child(5) { 
            color: #33cc33; 
            text-shadow: 3px 3px 0 #009900, 6px 6px 10px rgba(51, 204, 51, 0.4);
        }
        .google-letter:nth-child(6) { 
            color: #ff3333; 
            text-shadow: 3px 3px 0 #cc0000, 6px 6px 10px rgba(255, 51, 51, 0.4);
        }

        /* Search Container */
        .search-section {
            width: 100%;
            max-width: 584px;
        }

        .modality-buttons {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .modality-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border: 1px solid transparent;
            border-radius: 20px;
            background: var(--bg-secondary);
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .modality-btn:hover {
            background: var(--bg-primary);
            border-color: var(--border-color);
            box-shadow: 0 1px 3px var(--shadow-medium);
        }

        .modality-btn.active {
            background: var(--google-blue);
            color: white;
            border-color: var(--google-blue);
        }

        .modality-btn:active {
            background: var(--btn-active);
            transform: scale(0.95);
        }

        .modality-btn svg {
            width: 16px;
            height: 16px;
        }

        /* Search Bar */
        .search-bar-wrapper {
            position: relative;
            margin-bottom: 25px;
        }

        .search-bar {
            width: 100%;
            height: 48px;
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 0 50px 0 20px;
            font-size: 16px;
            outline: none;
            background: var(--bg-primary);
            color: var(--text-primary);
            box-shadow: 0 2px 5px 1px var(--shadow-medium);
            transition: all 0.3s ease;
        }

        .search-bar:hover {
            box-shadow: 0 4px 12px 2px var(--shadow-light);
        }

        .search-bar:focus {
            box-shadow: 0 4px 12px 2px var(--shadow-light);
            border-color: var(--google-blue);
        }

        .search-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            cursor: pointer;
        }

        /* Search Buttons */
        .search-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        .search-button {
            background-color: var(--bg-secondary);
            border: 1px solid transparent;
            border-radius: 4px;
            color: var(--text-primary);
            font-size: 14px;
            padding: 0 20px;
            height: 40px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .search-button:hover {
            border: 1px solid var(--border-color);
            box-shadow: 0 1px 2px var(--shadow-light);
        }

        .search-button:active {
            background-color: var(--btn-active);
            transform: scale(0.95);
            box-shadow: inset 0 2px 4px var(--shadow-medium);
        }

        /* Footer */
        .footer {
            background-color: var(--bg-footer);
        }

        .footer-top {
            padding: 15px 30px;
            border-bottom: 1px solid var(--border-color);
        }

        .country-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-primary);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .country-btn:hover {
            background: var(--bg-primary);
            box-shadow: 0 1px 3px var(--shadow-medium);
        }

        .country-btn:active {
            background: var(--btn-active);
            transform: scale(0.98);
        }

        .footer-bottom {
            padding: 15px 30px;
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .footer-links {
            display: flex;
            gap: 25px;
        }

        .footer-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s ease;
        }

        .footer-links a:hover {
            color: var(--text-link);
        }

        .footer-links a:active {
            color: var(--text-primary);
            background-color: var(--btn-active);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .google-letter {
                font-size: 60px;
            }
            
            .header-left a:not(:first-child) {
                display: none;
            }
            
            .header-right a:not(.apps-button):not(.profile-circle) {
                display: none;
            }
            
            .modality-buttons {
                flex-wrap: wrap;
            }
            
            .search-buttons {
                flex-direction: column;
                width: 100%;
                max-width: 300px;
            }
            
            .search-button {
                width: 100%;
            }
            
            .footer-content {
                flex-direction: column;
                text-align: center;
            }
            
            .footer-links {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="polka-dots"></div>

    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <a href="#">About</a>
            <a href="#">Store</a>
        </div>
        
        <div class="header-right">
            <a href="#">Gmail</a>
            <a href="#">Images</a>
            
            <div class="labs-container">
                <div class="labs-icon">
                    <div class="flask-neck"></div>
                    <div class="flask-body">
                        <div class="flask-liquid"></div>
                    </div>
                </div>
                <span class="labs-text">Search Labs</span>
            </div>
            
            <button class="apps-button" aria-label="Google Apps">
                <div class="apps-grid">
                    <span></span><span></span><span></span>
                    <span></span><span></span><span></span>
                    <span></span><span></span><span></span>
                </div>
            </button>
            
            <div class="profile-circle">D</div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Stylized Colorful Google Logo -->
        <div class="google-logo">
            <span class="google-letter">G</span>
            <span class="google-letter">o</span>
            <span class="google-letter">o</span>
            <span class="google-letter">g</span>
            <span class="google-letter">l</span>
            <span class="google-letter">e</span>
        </div>

        <div class="search-section">
            <!-- Search Modality Buttons -->
            <div class="modality-buttons">
                <button class="modality-btn active" data-modality="text">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    Text
                </button>
                <button class="modality-btn" data-modality="image">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                    Image
                </button>
                <button class="modality-btn" data-modality="video">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
                    Video
                </button>
                <button class="modality-btn" data-modality="audio">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                    Audio
                </button>
            </div>

            <!-- Search Bar -->
            <div class="search-bar-wrapper">
                <input type="text" class="search-bar" placeholder="Search Google or type a URL" aria-label="Search">
                <span class="search-icon">🔍</span>
            </div>

            <!-- Search Buttons -->
            <div class="search-buttons">
                <button class="search-button">Google Search</button>
                <button class="search-button">I'm Feeling Lucky</button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-top">
            <button class="country-btn">
                <span>🌍</span> India
            </button>
        </div>
        
        <div class="footer-bottom">
            <div class="footer-content">
                <div class="footer-links">
                    <a href="#">Advertising</a>
                    <a href="#">Business</a>
                    <a href="#">How Search works</a>
                </div>
                <div class="footer-links">
                    <a href="#">Privacy</a>
                    <a href="#">Terms</a>
                    <a href="#">Conditions</a>
                </div>
            </div>
        </div>
    </footer>

    <script>
        // Modality buttons - toggle active state
        const modalityButtons = document.querySelectorAll('.modality-btn');
        
        modalityButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                modalityButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        // Search functionality (visual only)
        const searchBar = document.querySelector('.search-bar');
        const searchButtons = document.querySelectorAll('.search-button');

        searchButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const query = searchBar.value.trim();
                if (query) {
                    console.log('Searching for:', query);
                } else {
                    console.log('Please enter a search term');
                }
            });
        });

        searchBar.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const query = searchBar.value.trim();
                if (query) {
                    console.log('Searching for:', query);
                }
            }
        });

        // Google Logo hover effect
        const letters = document.querySelectorAll('.google-letter');
        letters.forEach((letter, index) => {
            letter.addEventListener('mouseenter', () => {
                letter.style.transform = `scale(1.2) translateY(-10px)`;
            });
            letter.addEventListener('mouseleave', () => {
                letter.style.transform = 'scale(1) translateY(0)';
            });
        });

        console.log('🚀 Google Clone loaded! Try clicking the buttons.');
    </script>
</body>
</html>
